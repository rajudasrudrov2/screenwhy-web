name: ScreenWhy Frontend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCREENWHY_DATA_SOURCE: mock
      SCREENWHY_SITE_URL: https://screenwhy.com
      SCREENWHY_ALLOW_INDEXING: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned project dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Data and source guardrails
        run: npm run validate
      - name: Next.js production build
        run: npm run build
