name: ScreenWhy Frontend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCREENWHY_DATA_SOURCE: mock
      SCREENWHY_SITE_URL: https://screenwhy.com
      SCREENWHY_ALLOW_INDEXING: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned project dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Data and source guardrails
        run: npm run validate
      - name: Sitemap approved-only contract tests
        run: npm run validate:sitemap
      - name: Next.js production build
        run: npm run build
      - name: Package 05E R2 cumulative source
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/SW-FE-05E-R2-api-reconciliation'
        run: git archive --format=zip --output=screenwhy-web-05E-R2-api-integrated-source.zip HEAD
      - name: Upload verified 05E R2 source
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/SW-FE-05E-R2-api-reconciliation'
        uses: actions/upload-artifact@v4
        with:
          name: screenwhy-web-05E-R2-api-integrated-source
          path: screenwhy-web-05E-R2-api-integrated-source.zip
          retention-days: 7
